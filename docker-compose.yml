# Runs Simple Drive against a real S3-compatible server (minio).
#
#   docker compose up --build
#
#   curl -X POST http://localhost:3000/v1/blobs \
#     -H "Authorization: Bearer dev-token" \
#     -H "Content-Type: application/json" \
#     -d '{"id":"hello","data":"SGVsbG8gU2ltcGxlIFN0b3JhZ2UgV29ybGQh"}'
#
# minio web console: http://localhost:9001 (minioadmin / minioadmin)
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      SIMPLE_DRIVE_TOKEN: dev-token
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: simple-drive
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # One-shot job: waits for minio, creates the bucket, exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/simple-drive;
      "
